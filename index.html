<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>Sala de Aula VR</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: rgba(20, 24, 31, 0.72);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f2f4f8;
      --muted: #a4adbb;
      --accent: #ffc857;
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* ---------- tela inicial ---------- */
    #intro {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center;
      background: radial-gradient(120% 120% at 50% 0%, #1b2330 0%, var(--bg) 70%);
    }
    #intro h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); font-weight: 650; letter-spacing: -0.01em; }
    #intro p { margin: 0; max-width: 34ch; color: var(--muted); font-size: 15px; line-height: 1.45; }
    #bar { width: min(280px, 70vw); height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
    #bar > i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .15s linear; }
    #status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.2em; }
    #enter {
      appearance: none; border: 0; cursor: pointer;
      padding: 14px 34px; border-radius: 99px;
      background: var(--accent); color: #1a1405;
      font: inherit; font-weight: 650; font-size: 17px;
    }
    #enter:disabled { opacity: .35; cursor: default; }
    #enter:active:not(:disabled) { transform: scale(.97); }

    /* ---------- controles ---------- */
    #toolbar {
      position: fixed; z-index: 5;
      top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 70vw;
    }
    .btn {
      appearance: none; cursor: pointer;
      padding: 9px 14px; border-radius: 99px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font: inherit; font-size: 13px; font-weight: 550;
    }
    .btn[aria-pressed="true"] { background: var(--accent); color: #1a1405; border-color: transparent; }
    .btn:active { transform: scale(.96); }
    .btn[hidden] { display: none; }

    #pad {
      position: fixed; z-index: 5;
      left: max(28px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom));
      width: 120px; height: 120px; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--line);
      touch-action: none;
    }
    #pad[hidden] { display: none; }
    #knob {
      position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
      border-radius: 50%; background: rgba(255, 255, 255, .85);
    }
    #height {
      position: fixed; z-index: 5; display: flex; flex-direction: column; gap: 8px;
      right: max(10px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom));
    }
    #height[hidden] { display: none; }

    #exit {
      position: fixed; z-index: 6; top: 8px; left: 50%; transform: translateX(-50%);
    }
    #exit[hidden] { display: none; }
    body.stereo #toolbar, body.stereo #pad, body.stereo #height { display: none; }

    #error {
      position: fixed; z-index: 20; left: 8px; right: 8px; bottom: 8px; max-height: 40vh; overflow: auto;
      padding: 10px 12px; border-radius: 10px; background: rgba(120, 20, 20, .92);
      font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; user-select: text;
    }
    #error[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="intro">
    <h1>Sala de Aula VR</h1>
    <p id="hint">Segure o celular em pé e gire o corpo para olhar em volta.</p>
    <div id="bar"><i></i></div>
    <div id="status">Carregando modelo…</div>
    <button id="enter" disabled>Entrar</button>
  </div>

  <div id="toolbar" hidden>
    <button class="btn" id="btn-center">Centralizar</button>
    <button class="btn" id="btn-light">Brilho</button>
    <button class="btn" id="btn-walk" aria-pressed="false">Andar</button>
    <button class="btn" id="btn-vr" aria-pressed="false">Cardboard</button>
  </div>

  <div id="pad" hidden><div id="knob"></div></div>
  <div id="height" hidden>
    <button class="btn" id="btn-up" aria-label="Subir a câmera">▲</button>
    <button class="btn" id="btn-down" aria-label="Descer a câmera">▼</button>
  </div>

  <button class="btn" id="exit" hidden>Sair do Cardboard</button>
  <div id="error" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
