<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>Sala de Aula VR</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: rgba(20, 24, 31, 0.72);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f2f4f8;
      --muted: #a4adbb;
      --accent: #ffc857;
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* ---------- tela inicial ---------- */
    #intro {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center;
      background: radial-gradient(120% 120% at 50% 0%, #1b2330 0%, var(--bg) 70%);
    }
    #intro h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); font-weight: 650; letter-spacing: -0.01em; }
    #intro p { margin: 0; max-width: 34ch; color: var(--muted); font-size: 15px; line-height: 1.45; }
    #bar { width: min(280px, 70vw); height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
    #bar > i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .15s linear; }
    #status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.2em; }
    #enter {
      appearance: none; border: 0; cursor: pointer;
      padding: 14px 34px; border-radius: 99px;
      background: var(--accent); color: #1a1405;
      font: inherit; font-weight: 650; font-size: 17px;
